<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 1600" width="600" height="1600" fill="none">
  <defs>
    <mask id="cutouts-street">
      <rect width="600" height="1600" fill="white" />
      <rect x="40" y="60" width="520" height="330" rx="8" fill="black" />
      <rect x="40" y="410" width="520" height="330" rx="8" fill="black" />
      <rect x="40" y="760" width="520" height="330" rx="8" fill="black" />
      <rect x="40" y="1110" width="520" height="330" rx="8" fill="black" />
    </mask>
  </defs>

  <rect width="600" height="1600" rx="20" fill="#0f1d32" mask="url(#cutouts-street)" />

  <!-- แถบกราฟิกเฉียงด้านบนและด้านล่าง -->
  <path d="M0 1445L600 1375V1425L0 1495Z" fill="#1e3a5f" opacity="0.65" />
  <path d="M0 1500L600 1430V1455L0 1525Z" fill="#38bdf8" opacity="0.2" />

  <!-- เส้นขอบฟ้าสตรีท -->
  <rect x="40" y="60" width="520" height="330" rx="8" stroke="#38bdf8" stroke-width="3" />
  <rect x="40" y="410" width="520" height="330" rx="8" stroke="#38bdf8" stroke-width="3" />
  <rect x="40" y="760" width="520" height="330" rx="8" stroke="#38bdf8" stroke-width="3" />
  <rect x="40" y="1110" width="520" height="330" rx="8" stroke="#38bdf8" stroke-width="3" />

  <!-- หัวแถบ -->
  <text x="40" y="42" fill="#f8fafc" font-size="18" font-weight="900" letter-spacing="3" font-family="sans-serif">/// STREET SNAP</text>
  <rect x="460" y="18" width="100" height="28" rx="6" fill="#38bdf8" />
  <text x="510" y="37" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="900" font-family="monospace">VOL. 02</text>

  <!-- ไอคอนสายฟ้าขอบขวาช่อง 1-2 -->
  <g transform="translate(524 366)">
    <circle cx="16" cy="24" r="22" fill="#0f1d32" stroke="#38bdf8" stroke-width="2.5" />
    <path d="M18 8L7 25H16L13 40L27 21H18L18 8Z" fill="#38bdf8" />
  </g>

  <!-- ดาว 4 แฉกด้านซ้ายช่อง 2-3 -->
  <g transform="translate(18 725)">
    <path d="M22 0L28 16L44 22L28 28L22 44L16 28L0 22L16 16L22 0Z" fill="#facc15" stroke="#0f172a" stroke-width="2.5" />
  </g>

  <!-- แท็กมุมขวาช่อง 3-4 -->
  <rect x="430" y="1086" width="130" height="28" rx="14" fill="#1e293b" stroke="#38bdf8" stroke-width="2" />
  <text x="495" y="1105" text-anchor="middle" fill="#38bdf8" font-size="12" font-weight="bold" font-family="monospace">RAW ARCHIVE</text>

  <!-- ท้ายแถบ Street Navy -->
  <rect x="40" y="1474" width="146" height="30" rx="4" fill="#38bdf8" />
  <text x="113" y="1495" text-anchor="middle" fill="#0f172a" font-size="14" font-weight="900" letter-spacing="2" font-family="sans-serif">ORIGINAL</text>

  <text x="40" y="1552" fill="#f8fafc" font-size="38" font-weight="900" letter-spacing="3" font-family="sans-serif">NAVY CLUB</text>
  <text x="560" y="1550" text-anchor="end" fill="#94a3b8" font-size="16" font-weight="bold" font-family="monospace">EST. 2026</text>
